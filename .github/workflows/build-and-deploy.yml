name: CI
on:
  push:
    tags: '*'
    branches-ignore:
      - 'autodelivery**'
      - 'bump-**'
      - 'renovate/**'
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'README.md'
      - 'renovate.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows, macos, ubuntu]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Build all exercises
        shell: bash
        run: ./gradlew build compileTestJava -x test --warning-mode=fail
      - name: Test solutions
        if: github.ref == 'refs/heads/solution' || github.base_ref == 'solution'
        shell: bash
        run: ./gradlew test --warning-mode=fail
